  --crit:#c62828; --crit-bg:#fdecec; --high:#e65100; --high-bg:#fff1e5; --med:#a67c00; --med-bg:#fff8db; --low:#2e7d32; --low-bg:#e8f5e9;
  --ok:#2e7d32; --warn:#e65100; --bad:#c62828; --obs:#7c3aed;

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.55 "Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR","Noto Sans CJK KR",system-ui,sans-serif}
button{font:inherit;cursor:pointer}

.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12px}
.sys{background:#11151e;color:#9aa4b5;font-size:11px;padding:3px 16px}
.top{background:var(--top);color:#dfe5ef;display:flex;align-items:center;height:48px;padding:0 16px;gap:4px;position:sticky;top:0;z-index:20}

.nav{display:flex;gap:2px;overflow-x:auto}

.page{padding:14px 18px 40px;max-width:1500px;margin:0 auto}
.crumb{color:var(--ink3);font-size:12px;margin-bottom:8px}
.bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px}
.panel>h3{margin:0;padding:10px 14px;border-bottom:1px solid var(--line2);font-size:13px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}

.pbody{padding:12px 14px}

.shade{position:fixed;inset:0;background:rgba(15,20,30,.3);z-index:30;display:none}.shade.on{display:block}
.modal{position:fixed;left:50%;top:6vh;transform:translateX(-50%);width:min(820px,96vw);max-height:88vh;background:#fff;border-radius:8px;box-shadow:0 16px 40px rgba(0,0,0,.25);z-index:50;display:none;flex-direction:column}

.toggle{display:inline-block;width:32px;height:18px;border-radius:9px;background:#cfd6e0;position:relative;cursor:pointer;vertical-align:middle}
.toggle::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:left .15s}
.toggle.on{background:var(--accent)}.toggle.on::after{left:16px}

const evProd=k=>EV[k][1];
const prodCount=s=>{const c={MTA:0,MDS:0,NSM:0};s.steps.forEach(k=>c[evProd(k)]++);return c};
const stageBar=s=>`<span class="stg">${STAGES.map(st=>{const p=s.steps.map(k=>EV[k]).find(e=>e[3]===st);return `<i class="${p?p[1]:''}" title="${st}${p?' · '+p[1]:''}"></i>`}).join('')}</span>`;
const lastStage=s=>STAGES.filter(st=>s.steps.some(k=>EV[k][3]===st)).pop();

function hlStep(n){$$('ol.narr li').forEach(li=>li.classList.remove('hl'));const li=$('#sn'+n);if(li){li.classList.add('hl');li.scrollIntoView({behavior:'smooth',block:'center'})}}
const NCOL={mail:['#e0f2f1','#00897b'],user:['#eef1f5','#5b6676'],pc:['#eef3fd','#9db8ef'],file:['#e9f0fd','#2f6fde'],ext:['#fff1e5','#e65100']};
const ECOL={MTA:'#00897b',MDS:'#2f6fde',NSM:'#7c3aed',link:'#9aa4b5',est:'#7c3aed'};
function graph(s){
  const N=s.graph.nodes,CW=245,RH=78,bw=152,bh=42;
  const maxc=Math.max(...N.map(n=>n[4])),maxr=Math.max(...N.map(n=>n[5]));const W=(maxc+1)*CW+20,H=(maxr+1)*RH+30,pos={};
  N.forEach(n=>pos[n[0]]={x:10+n[4]*CW,y:15+n[5]*RH,n});
  let svg=`<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}"><defs>${Object.entries(ECOL).map(([k,c])=>`<marker id="a${k}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="${c}"/></marker>`).join('')}</defs>`;
  s.graph.edges.forEach(([a,b,lab,k])=>{const p=pos[a],q=pos[b];
   // 같은 열 = 위아래로, 왼쪽으로 가는 선 = 대상 오른쪽 변으로, 그 밖 = 오른쪽 변에서 왼쪽 변으로
   const same=q.x===p.x,left=q.x<p.x,down=q.y>p.y;
   const x1=same?p.x+bw/2:left?p.x:p.x+bw,y1=same?p.y+(down?bh:0):p.y+bh/2,x2=same?q.x+bw/2:left?q.x+bw:q.x,y2=same?q.y+(down?0:bh):q.y+bh/2;
   const mx=(x1+x2)/2,my=(y1+y2)/2,c=ECOL[k],dash=k==='link'?'3 3':k==='est'?'5 4':'';const lw=lab.length*7+10;
   svg+=`<path d="M${x1} ${y1}C${same?x1:mx} ${same?my:y1},${same?x2:mx} ${same?my:y2},${x2} ${y2}" fill="none" stroke="${c}" stroke-width="${k==='link'||k==='est'?1.2:1.8}" ${dash?`stroke-dasharray="${dash}"`:''} marker-end="url(#a${k})"/>`;
   if(k!=='link')svg+=`<rect x="${mx-lw/2}" y="${my-8}" width="${lw}" height="15" rx="3" fill="#fff" stroke="#e1e5eb"/><text x="${mx}" y="${my+3}" text-anchor="middle" style="fill:${c};font-weight:700">${esc(lab)}</text>`});
  N.forEach(([id,kind,label,t,,,est])=>{const p=pos[id],[f,st]=NCOL[t];const lab=label.length>20?label.slice(0,19)+'…':label;
   svg+=`<g class="gnode" data-n="${id}"><rect x="${p.x}" y="${p.y}" width="${bw}" height="${bh}" rx="7" fill="${f}" stroke="${est?'#7c3aed':st}" ${est?'stroke-dasharray="5 4"':''}/><text x="${p.x+bw/2}" y="${p.y+17}" text-anchor="middle" style="font-weight:700;fill:#1f2733">${esc(lab)}</text><text x="${p.x+bw/2}" y="${p.y+33}" text-anchor="middle">${esc(kind)}${est?' · 추정':''}</text></g>`});
  return svg+'</svg>';
}
function nodeInfo(s,id){

  if(t==='pc'&&PCS[label]){const p=PCS[label];openDrawer(label,`<span class="chip">${kind}</span>`,`<dl class="kv"><dt>IP</dt><dd class="mono">${p.ip}</dd><dt>센서 구간</dt><dd>${p.sensor}</dd><dt>MDS Agent</dt><dd>${p.agent||'<span class="warntxt">없음</span>'}</dd><dt>IP → PC 연결</dt><dd>${p.ipvia[1]} · 신뢰도 ${p.ipvia[2]}</dd></dl>

  openDrawer(label,`<span class="chip">${kind}</span>`,`<div class="note">${t==='file'?'파일은 SHA-256으로 제품 사이를 그대로 잇습니다(신뢰도 95).':t==='mail'?'메일함은 디렉터리의 mail 속성으로 사용자와 잇습니다.':'외부 대상은 등록 도메인·URL·외부 IP로 제품 사이를 그대로 잇습니다. 흔한 외부 대상(CDN 등)은 묶는 키에서 뺍니다.'}</div>`);
}

    <div class="panel tw"><table class="t"><tr><th>사용</th><th>룰</th><th>유형</th><th>묶는 키</th><th>창</th><th>등급</th><th>최근 7일</th></tr>
     ${RULES.map(x=>`<tr class="click ${x.id===selRule?'sel':''}" data-r="${x.id}"><td><span class="toggle ${x.on?'on':''}" data-tg="${x.id}"></span></td><td><b>${x.id}</b> ${esc(x.title)}<span class="sub">${x.builtin?'기본 제공':'고객 정의 · '+x.owner}</span></td><td class="mono">${x.type}</td><td class="mono">${esc(x.by)}</td><td class="nw">${x.span}</td><td>${sev(x.sev)}</td><td class="nw">${spark(x.hits)} ${x.hits.reduce((a,b)=>a+b,0)}건</td></tr>`).join('')}</table></div>
    <div class="panel"><h3>${r.id} · ${esc(r.title)} <span class="r">${r.builtin?'기본 제공':'고객 정의'}</span></h3><div class="pbody">
      <div class="flow">${r.steps.map((st,i)=>`${i?'<span class="ar">→</span>':''}<span class="st">${prod(st[0])} ${esc(st[1])}</span>`).join('')}</div>
      <div class="note" style="margin:8px 0">같은 <b>${esc(r.by)}</b> · ${r.span} 안${r.type==='temporal_ordered'?' · 순서대로':''}${r.late?` · 늦은 판정 ${r.late} 다시 평가`:''}${r.conf?` · 연결 신뢰도 ${r.conf} 이상`:''}${r.pivot?' · 피벗(대상 → 다음 출발지)':''}</div>
      <pre class="yaml">${YAML[r.id]}</pre>
      <div class="bar" style="margin-top:10px"><button class="btn pri" id="bt">사전 검증(지난 14일)</button><button class="btn" onclick="toast('편집기(목업): 저장하면 사전 검증 후 적용')">수정</button><button class="btn" onclick="toast('예외(목업): scope = ${r.id}')">예외</button></div>
    </div></div></div>`;
  $$('#admBody tr[data-r]').forEach(tr=>tr.onclick=e=>{if(e.target.dataset.tg){const x=RULES.find(y=>y.id===e.target.dataset.tg);x.on=!x.on;toast(`${x.id} ${x.on?'사용':'사용 안 함'}(배포 전)`);renderRules();return}selRule=tr.dataset.r;renderRules()});
  $('#bt').onclick=()=>backtest(r);
}
function spark(a){const m=Math.max(1,...a);return `<svg width="56" height="16" style="vertical-align:middle">${a.map((v,i)=>`<rect x="${i*8}" y="${16-Math.max(v?2:0,14*v/m)}" width="6" height="${Math.max(v?2:0,14*v/m)}" fill="#b71c1c" opacity=".7"/>`).join('')}</svg>`}
function backtest(r){
  openModal(`사전 검증 · ${r.id} ${r.title}`,`<div class="note">저장된 이벤트(ClickHouse)를 지난 14일 시간순으로 다시 흘려, 이 룰이 맞았을 건수와 예시를 봅니다. 결과를 보고 적용 여부를 정합니다.</div>
   <div class="prog" style="margin:12px 0"><i id="bp"></i></div><div id="bout" class="note">이벤트 다시 흘리는 중…</div>`,'<button class="btn" onclick="closeModal()">닫기</button><button class="btn pri" id="bapply" disabled>적용</button>');
  let w=0;const tk=setInterval(()=>{w+=20;$('#bp').style.width=w+'%';if(w>=100){clearInterval(tk);
   const n=r.hits.reduce((a,b)=>a+b,0)*2+(r.id==='C-05'?9:0);
   $('#bout').innerHTML=`<div class="grid g4" style="margin-top:4px"><div class="panel kpi"><div class="k">읽은 이벤트</div><div class="v">48,212</div><div class="d">MTA 31,904 · MDS 2,113 · NSM 14,195</div></div><div class="panel kpi"><div class="k">맞은 건수</div><div class="v">${n}</div><div class="d">하루 평균 ${(n/14).toFixed(1)}건</div></div><div class="panel kpi"><div class="k">추정 연결로만 맞음</div><div class="v">${r.conf?Math.round(n/5):0}</div><div class="d">신뢰도 50 미만(알림 없음)</div></div><div class="panel kpi"><div class="k">이미 다른 사건에 포함</div><div class="v">${Math.round(n/3)}</div><div class="d">NSM 상관과 같은 사건</div></div></div>
    ${r.id==='C-05'?'<div class="callout warn" style="margin-top:10px">하루 평균이 높습니다. 대부분 스팸 차단 메일입니다. 조치가 "차단"인 메일은 빼는 조건을 기본 룰에 넣는 것을 권합니다.</div>':'<div class="oktxt" style="margin-top:10px">✔ 하루 평균이 적어 알림 피로 위험이 낮습니다.</div>'}
    <table class="t" style="margin-top:10px"><tr><th>예시</th><th>묶은 키</th><th>이벤트</th></tr><tr><td class="nw">11-12 14:03</td><td class="mono">${esc(r.by.split(',')[0])} = PC-HR-02</td><td>${r.steps.map(s=>prod(s[0])).join(' → ')}</td></tr><tr><td class="nw">11-15 10:41</td><td class="mono">${esc(r.by.split(',')[0])} = PC-FN-11</td><td>${r.steps.map(s=>prod(s[0])).join(' → ')}</td></tr></table>`;
   $('#bapply').disabled=false;$('#bapply').onclick=()=>{closeModal();toast(`${r.id} 적용했습니다(목업)`)}}},250);
}
function goRule(id){closeDrawer();selRule=id;$$('#nav button').forEach(x=>x.classList.toggle('on',x.dataset.v==='admin'));$('#v-xa').classList.add('hidden');$('#v-other').classList.add('hidden');$('#v-admin').classList.remove('hidden');renderRules()}

// =============================================================== 시작
renderStories();
</script>
</body>
</html>
