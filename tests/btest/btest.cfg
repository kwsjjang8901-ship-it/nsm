[btest]
TestDirs    = rules cluster asset-id
TmpDir      = %(testbase)s/output
BaselineDir = %(testbase)s/Baseline
IgnoreDirs  = output
IgnoreFiles = *.tmp *.swp #* *.trace .DS_Store

[environment]
TZ=UTC
LC_ALL=C
PATH=%(testbase)s/tools:%(default_path)s
TRACES=%(testbase)s/../pcaps
PKG=%(testbase)s/../../nsm_rules
# 자산 식별 단독 테스트(asset-id/): nsm_rules 없이 자산 식별 패키지만 로드한다
ASSETID=%(testbase)s/../../nsm_rules/asset-id
SETUP=%(testbase)s/setup.zeek
FILES=%(testbase)s/files
